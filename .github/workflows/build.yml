# Continuous integration for the Qin F21 Toolbox.
#
# Both supported build paths run on every push and pull request:
#
#   offline-build:
#     1. fetch the pinned tool-chain (JDK 11, kotlinc, aapt2, d8, apksigner, android.jar)
#     2. self test the pure Kotlin modules (183 checks)
#     3. compile, dex, package and sign the APK without an Android SDK
#     4. verify the signature and upload the APK as an artefact
#
#   gradle-build:
#     1. set up JDK 17 and the Android SDK (platform 30)
#     2. build the app with Gradle (AGP 7.4.2, Kotlin 1.8.22)
#     3. upload the debug and release APKs as artefacts
name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  offline-build:
    name: Offline pipeline (self test + APK)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Cache offline tool-chain
        uses: actions/cache@v6
        with:
          path: tools/toolchain
          key: toolchain-v1-${{ hashFiles('tools/fetch-toolchain.sh') }}
          restore-keys: |
            toolchain-v1-

      - name: Fetch offline tool-chain
        run: tools/fetch-toolchain.sh

      - name: Run self test (pure Kotlin modules, 183 checks)
        run: tools/selftest.sh

      - name: Build and sign APK (offline pipeline)
        run: tools/build-offline.sh

      - name: Verify APK signature
        run: |
          TC=tools/toolchain
          "$TC/jdk/bin/java" -cp "$TC/apksigner.jar" \
            com.android.apksigner.ApkSignerTool verify --print-certs \
            build/outputs/qin-f21-toolbox-1.0.0.apk

      - name: Upload signed APK
        uses: actions/upload-artifact@v7
        with:
          name: qin-f21-toolbox-1.0.0.apk
          path: build/outputs/qin-f21-toolbox-1.0.0.apk
          if-no-files-found: error

  gradle-build:
    name: Gradle build (Android SDK 30)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK (platform 30, build-tools 33.0.1)
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-30 build-tools;33.0.1'

      - name: Point Gradle at the SDK
        run: |
          if [ -z "${ANDROID_HOME:-}" ]; then
            echo "sdk.dir=$HOME/.android/sdk" > local.properties
          fi

      - name: Set up Gradle (wrapper + dependency cache)
        uses: gradle/actions/setup-gradle@v3

      - name: Surface Gradle errors as annotations
        if: always()
        run: |
          cat > matcher.json <<'EOF'
          {
            "problemMatcher": [
              {
                "owner": "gradle-build-errors",
                "pattern": [
                  { "regexp": "^GRADLE_ERROR (.*)$", "message": "1" }
                ]
              }
            ]
          }
          EOF
          echo "::add-matcher::$GITHUB_WORKSPACE/matcher.json"

      - name: Build debug and release APKs
        run: |
          # --no-daemon: single JVM for the one-off CI build; the Kotlin compiler
          # runs in-process so no extra daemon JVM competes for the runner's RAM.
          # Error-looking lines are tagged GRADLE_ERROR so the problem matcher
          # turns them into annotations (readable without the full log).
          set -o pipefail
          set +e
          # :app:printSources is a diagnostic that dumps the resolved source roots of
          # every compiler (and whether they exist) so failures are provable, not
          # guessable.
          ./gradlew --no-daemon \
            :app:printSources :app:assembleDebug :app:assembleRelease \
            -Pkotlin.compiler.execution.strategy=in-process \
            --stacktrace 2>&1 | tee gradle-build.log | awk '
            /^GRADLE_ERROR / { print; next }  # already tagged (diagnostic task, earlier steps)
            /FAILURE: Build failed/ || /What went wrong/ || /Execution failed for task/ ||
            /Caused by:/ || /Exception is:/ || /^e: / || /error: / ||
            /> Task .* FAILED/ || /Missing class/ || /OutOfMemory/ ||
            /exited unexpectedly/ || /The build process/ || /SDK location not found/ ||
            /^[[:space:]]*> (A failure|Could not|No |The |Execution)/ {
              print "GRADLE_ERROR " $0
            }'
          rc=${PIPESTATUS[0]}
          exit $rc

      - name: Report build failure as annotations
        if: failure()
        run: |
          echo "GRADLE_ERROR log: $(wc -c < gradle-build.log 2>/dev/null || echo missing) bytes, $(wc -l < gradle-build.log 2>/dev/null || echo 0) lines"
          dmesg 2>/dev/null | grep -iE "oom|killed process" | tail -3 | sed 's/^/GRADLE_ERROR dmesg: /'
          echo "GRADLE_ERROR === head of gradle-build.log ==="
          head -6 gradle-build.log 2>/dev/null | sed 's/^/GRADLE_ERROR /'
          echo "GRADLE_ERROR === tail of gradle-build.log ==="
          tail -8 gradle-build.log 2>/dev/null | sed 's/^/GRADLE_ERROR /'
          for f in hs_err_pid*.log; do
            [ -e "$f" ] || continue
            echo "GRADLE_ERROR === JVM crash log: $f ==="
            head -4 "$f" | sed 's/^/GRADLE_ERROR /'
          done
          true

      # The full log is the ground truth; annotations are a best-effort summary.
      - name: Upload failure log
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: gradle-build-failure-log
          path: |
            gradle-build.log
            hs_err_pid*.log
          if-no-files-found: ignore

      - name: Upload APKs
        uses: actions/upload-artifact@v7
        with:
          name: qin-f21-toolbox-gradle-apks
          path: app/build/outputs/apk/**/*.apk
          if-no-files-found: error
