# Continuous integration for the Qin F21 Toolbox.
#
# Both supported build paths run on every push and pull request:
#
#   offline-build:
#     1. fetch the pinned tool-chain (JDK 11, kotlinc, aapt2, d8, apksigner, android.jar)
#     2. self test the pure Kotlin modules (183 checks)
#     3. compile, dex, package and sign the APK without an Android SDK
#     4. verify the signature and upload the APK as an artefact
#
#   gradle-build:
#     1. set up JDK 17 and the Android SDK (platform 30)
#     2. build the app with Gradle (AGP 7.4.2, Kotlin 1.8.22)
#     3. upload the debug and release APKs as artefacts
name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  offline-build:
    name: Offline pipeline (self test + APK)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Cache offline tool-chain
        uses: actions/cache@v6
        with:
          path: tools/toolchain
          key: toolchain-v1-${{ hashFiles('tools/fetch-toolchain.sh') }}
          restore-keys: |
            toolchain-v1-

      - name: Fetch offline tool-chain
        run: tools/fetch-toolchain.sh

      - name: Run self test (pure Kotlin modules, 183 checks)
        run: tools/selftest.sh

      - name: Build and sign APK (offline pipeline)
        run: tools/build-offline.sh

      - name: Verify APK signature
        run: |
          TC=tools/toolchain
          "$TC/jdk/bin/java" -cp "$TC/apksigner.jar" \
            com.android.apksigner.ApkSignerTool verify --print-certs \
            build/outputs/qin-f21-toolbox-1.0.0.apk

      - name: Upload signed APK
        uses: actions/upload-artifact@v7
        with:
          name: qin-f21-toolbox-1.0.0.apk
          path: build/outputs/qin-f21-toolbox-1.0.0.apk
          if-no-files-found: error

  gradle-build:
    name: Gradle build (Android SDK 30)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK (platform 30, build-tools 33.0.1)
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-30 build-tools;33.0.1'

      - name: Point Gradle at the SDK
        run: |
          if [ -z "${ANDROID_HOME:-}" ]; then
            echo "sdk.dir=$HOME/.android/sdk" > local.properties
          fi

      - name: Set up Gradle (wrapper + dependency cache)
        uses: gradle/actions/setup-gradle@v3

      - name: Surface Gradle errors as annotations
        if: always()
        run: |
          cat > matcher.json <<'EOF'
          {
            "problemMatcher": [
              {
                "owner": "gradle-build-errors",
                "pattern": [
                  { "regexp": "^GRADLE_ERROR (.*)$", "message": "1" }
                ]
              }
            ]
          }
          EOF
          echo "::add-matcher::$GITHUB_WORKSPACE/matcher.json"

      - name: Check Gradle configuration (./gradlew help)
        run: |
          set -o pipefail
          ./gradlew help 2>&1 | tee gradle-config.log

      - name: Build debug and release APKs
        run: |
          set -o pipefail
          ./gradlew :app:assembleDebug :app:assembleRelease --stacktrace 2>&1 | tee gradle-build.log

      - name: Report build failure as annotations
        if: failure()
        run: |
          { grep -E "FAILURE:|What went wrong|Execution failed|Caused by|^[ew]: |> Task .* FAILED|error:|Missing class|SDK location not found" gradle-config.log gradle-build.log 2>/dev/null; \
            grep -E "^\s*> " gradle-build.log 2>/dev/null | head -20; } \
            | sort -u | sed 's/^/GRADLE_ERROR /' | head -40 || true

      - name: Upload APKs
        uses: actions/upload-artifact@v7
        with:
          name: qin-f21-toolbox-gradle-apks
          path: app/build/outputs/apk/**/*.apk
          if-no-files-found: error
