# The toolbox has no third party runtime dependency, the build stays small and fast.
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true

android.useAndroidX=false
android.enableJetifier=false

# AGP 8 defaults to non-transitive R classes. The app deliberately reads the resources of
# core:design through its own R class (R.drawable.ic_camera, R.color.accent, ...), so keep
# the pre-AGP-8 behaviour instead of rewriting every reference to point at the library R.
android.nonTransitiveRClass=false
kotlin.code.style=official
